# Single source of configuration. Secrets live in .env, never here.
llm:
  base_url: "https://api.groq.com/openai/v1"
  extraction_model: "openai/gpt-oss-120b"   # heavy reasoning: triple extraction
  light_model: "openai/gpt-oss-20b"         # lighter calls (query entities, etc.)
  temperature: 0.0
  # gpt-oss emits hidden reasoning tokens that count against this budget.
  # 2048 leaves headroom over a ~15-triple JSON answer (~600 tokens).
  max_completion_tokens: 2048
  reasoning_effort: "low"                   # low | medium | high | null
  timeout_s: 60
  max_retries: 3                            # SDK retries 429/5xx with backoff
  api_key_env: "GROQ_API_KEY"
  requests_per_minute: 20                   # client-side throttle for the free tier

extraction:
  max_triples_per_chunk: 15
  max_chunk_chars: 4000                     # safety cap; Phase 2 chunks will be smaller
  max_entity_chars: 80
  max_relation_chars: 40
  require_grounded_entities: true           # drop triples whose entities aren't in the chunk

paths:
  docs_dir: "data/docs"
  index_dir: "data/index"                   # ChromaDB persistence
  graph_path: "data/graph/graph.json"
  cache_path: "data/cache/extractions.json" # LLM extraction cache (saves quota on re-ingest)

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 32

chunking:
  # Counted with the embedding model's own tokenizer. MiniLM truncates input at
  # 256 word-pieces, so chunks must stay under that or their tails are never embedded.
  max_tokens: 200
  overlap_tokens: 40

vector_store:
  collection: "chunks"

retrieval:
  vector_k: 3                    # chunks from vector search inside hybrid retrieval
  max_hops: 2                    # graph traversal depth (capped at 3 in config validation)
  max_neighbors_per_node: 8      # per-node expansion cap: stops hub nodes exploding
  max_graph_chunks: 8            # graph candidates passed to fusion
  final_k: 4                     # context budget; vector-only baseline gets the same budget
  rrf_k: 60                      # Reciprocal Rank Fusion constant (standard value)
  entity_mode: "both"            # lexical | llm | both: how question entities are found
  entity_match_threshold: 0.75   # min cosine for embedding fallback matching
  min_lexical_chars: 3           # skip very short node names in lexical matching
  path_rerank: true              # light LLM orders graph paths by relevance (1 extra call/query)
  rerank_candidates: 10          # graph candidates shown to the reranker

generation:
  model_role: "heavy"            # heavy = llm.extraction_model (multi-hop synthesis), light = llm.light_model
  max_context_chars: 6000        # whole chunks are dropped from the tail past this; never cut mid-chunk

evaluation:
  questions_path: "data/eval/questions.yaml"
  results_path: "data/eval/results.json"
  recall_at_k: [2, 3, 4, 5, 6]   # retrieval recall measured at each budget (no extra LLM calls)